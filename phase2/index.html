<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>厂区通 · 中化蓝天陕西基地</title><link rel="stylesheet" href="素材/二期.css?v=4c74df6827de"></head>
<body><div class="preview-stage" aria-label="厂区通手机服务界面">
<div class="phone-shell">
<div class="phone-screen"><div class="phone-status"><span id="phone-time"></span><img class="phone-status-icons" src="素材/status/ios-status-icons.svg" alt="蜂窝信号、无线网络和电量"></div><main id="app" class="app"></main><div class="phone-home"><span></span></div></div>
<img class="phone-bezel" src="素材/iphone/Bezel.png" alt="" draggable="false">
</div></div><dialog id="modal"><div id="dialog-content"></div><button class="button secondary" id="close-modal">关闭，返回流程</button></dialog><script src="素材/流程数据.js?v=1af6e055b2c9"></script><script src="素材/图标.js?v=1e4e5d1cfd6b"></script><script src="素材/页面1数据.js?v=7444b4379adc"></script><script src="素材/AHF页面2-6数据.js?v=56fbe0991de1"></script><script src="素材/二期.js?v=70d9ab563cd0"></script><script>
(function(){
 const stage=document.querySelector('.preview-stage');
 function fitPhone(){
  const width=Math.min(innerWidth,innerHeight*16/9);
  const height=width*9/16;
  const scale=Math.min((height-32)/968,(width-32)/511);
  document.documentElement.style.setProperty('--preview-scale',Math.max(.1,scale));
  stage.style.width=width+'px';
  stage.style.height=height+'px';
 }
 function setTime(){document.getElementById('phone-time').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}
 fitPhone();setTime();addEventListener('resize',fitPhone);setInterval(setTime,30000);
})();
</script></body></html>
